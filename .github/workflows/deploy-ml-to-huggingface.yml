name: Deploy ML Service to Hugging Face
on:
  push:
    branches: [main]
    paths:
      - 'ml_service/**'
  # Allow manual workflow triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Hugging Face Hub CLI
        run: pip install -U "huggingface_hub[cli]"

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # The new HF CLI replaces the deprecated huggingface-cli
          hf upload ashlogg/student-shield-official ./ml_service . --repo-type space --token $HF_TOKEN
