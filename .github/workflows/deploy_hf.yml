name: Deploy ML Service to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - 'ml_service/**'
      - '.github/workflows/deploy_hf.yml'
  workflow_dispatch:

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Hugging Face Hub CLI
        run: pip install -U "huggingface_hub[cli]"

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload ashlogg/student_shield_official ./ml_service . --repo-type space --token $HF_TOKEN
