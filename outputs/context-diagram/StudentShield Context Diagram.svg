<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150" role="img" aria-labelledby="title desc"><title id="title">StudentShield web application context diagram</title><desc id="desc">One process exchanges data with Student, Counselor, Super Administrator, the external ML service, and Parent or Guardian. Scope: vent screening and bullying reporting.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker></defs><rect width="1500" height="1150" fill="white"/><g font-family="Times New Roman, Times, serif" fill="#111" font-size="25"><rect x="570" y="25" width="360" height="115" fill="white" stroke="#111" stroke-width="2.5"/><text x="750.0" y="60.5" text-anchor="middle" font-size="27" font-weight="bold"><tspan x="750.0" dy="0">ML Service</tspan><tspan x="750.0" dy="30">FastAPI</tspan><tspan x="750.0" dy="30">Hugging Face Spaces</tspan></text><rect x="20" y="400" width="220" height="290" fill="white" stroke="#111" stroke-width="2.5"/><text x="130.0" y="553.0" text-anchor="middle" font-size="27" font-weight="bold"><tspan x="130.0" dy="0">Student</tspan></text><rect x="1260" y="350" width="220" height="200" fill="white" stroke="#111" stroke-width="2.5"/><text x="1370.0" y="458.0" text-anchor="middle" font-size="27" font-weight="bold"><tspan x="1370.0" dy="0">Counselor</tspan></text><rect x="1260" y="630" width="220" height="180" fill="white" stroke="#111" stroke-width="2.5"/><text x="1370.0" y="713.0" text-anchor="middle" font-size="27" font-weight="bold"><tspan x="1370.0" dy="0">Super</tspan><tspan x="1370.0" dy="30">Administrator</tspan></text><rect x="570" y="1010" width="360" height="110" fill="white" stroke="#111" stroke-width="2.5"/><text x="750.0" y="1073.0" text-anchor="middle" font-size="27" font-weight="bold"><tspan x="750.0" dy="0">Parent / Guardian</tspan></text><rect x="600" y="330" width="300" height="490" rx="35" fill="white" stroke="#111" stroke-width="3"/><path d="M600 400 H900" stroke="#111" stroke-width="2"/><text x="750" y="375" text-anchor="middle" font-size="30" font-weight="bold"><tspan x="750" dy="0">0</tspan></text><text x="750" y="540" text-anchor="middle" font-size="30" font-weight="bold"><tspan x="750" dy="0">StudentShield</tspan><tspan x="750" dy="30">Web Application</tspan></text><text x="750" y="640" text-anchor="middle" font-size="25"><tspan x="750" dy="0">Vent screening and</tspan><tspan x="750" dy="30">bullying reporting</tspan></text><path d="M660 330 L660 140" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="646" y="205" text-anchor="end" font-size="24"><tspan x="646" dy="0">Current vent text, student ID,</tspan><tspan x="646" dy="30">14-day risk labels</tspan><tspan x="646" dy="30">and timestamps</tspan></text><path d="M840 140 L840 330" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="854" y="220" text-anchor="start" font-size="24"><tspan x="854" dy="0">Risk classification, score,</tspan><tspan x="854" dy="30">and emotion results</tspan></text><path d="M240 460 L600 460" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="420" y="386" text-anchor="middle" font-size="24"><tspan x="420" dy="0">Credentials; vent text and</tspan><tspan x="420" dy="30">parent-hiding selection;</tspan><tspan x="420" dy="30">incident details and evidence</tspan></text><path d="M600 650 L240 650" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="420" y="576" text-anchor="middle" font-size="24"><tspan x="420" dy="0">Authentication results;</tspan><tspan x="420" dy="30">submission confirmations</tspan><tspan x="420" dy="30">and report status</tspan></text><path d="M1260 420 L900 420" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1080" y="346" text-anchor="middle" font-size="23"><tspan x="1080" dy="0">Credentials; review requests;</tspan><tspan x="1080" dy="30">verification / rejection decisions;</tspan><tspan x="1080" dy="30">case notes and status updates</tspan></text><path d="M900 520 L1260 520" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1080" y="476" text-anchor="middle" font-size="23"><tspan x="1080" dy="0">Case records, screening results,</tspan><tspan x="1080" dy="30">and counselor notifications</tspan></text><path d="M1260 700 L900 700" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1080" y="626" text-anchor="middle" font-size="23"><tspan x="1080" dy="0">Credentials; account / role changes;</tspan><tspan x="1080" dy="30">case decisions and updates;</tspan><tspan x="1080" dy="30">audit and record requests</tspan></text><path d="M900 790 L1260 790" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1080" y="746" text-anchor="middle" font-size="23"><tspan x="1080" dy="0">Account, case and audit records;</tspan><tspan x="1080" dy="30">operation results</tspan></text><path d="M750 820 L750 1010" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="764" y="905" text-anchor="start" font-size="25"><tspan x="764" dy="0">Conditional SMS / email</tspan><tspan x="764" dy="30">notification messages [1]</tspan></text></g></svg>